name: Generar Wallpapers JSON Automatico

on:
  push:
    paths:
      - 'img/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.mp4'
      - '!wallpapers.json'
      - '!img/thumbs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar FFmpeg y librerias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install google-genai Pillow opencv-python-headless requests; fi

      - name: Ejecutar script generador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generador.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json img/thumbs/
          git commit -m "Auto-clasificación con Google Gemini, miniaturas WebP y Push OneSignal [skip ci]" || echo "Sin cambios para guardar"
          git push
