name: Generar Wallpapers JSON Automatico

on:
  push:
    paths:
      - 'img/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar FFmpeg en el sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias de imagenes y video
        run: pip install Pillow opencv-python-headless

      - name: Ejecutar script generador
        run: python generador.py

      - name: Guardar wallpapers.json y miniaturas en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json img/
          git commit -m "Auto-actualizacion y optimizacion de wallpapers" || echo "Sin cambios"
          git push
