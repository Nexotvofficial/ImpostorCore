name: Generar Wallpapers JSON Automatico

on:
  push:
    paths:
      - 'img/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias de IA y procesamiento de imagenes
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow transformers pyyaml

      - name: Ejecutar script generador con IA
        run: python generador.py

      - name: Guardar wallpapers.json en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json
          git commit -m "Auto-clasificación de fondos con IA y actualización de JSON" || echo "Sin cambios"
          git push
