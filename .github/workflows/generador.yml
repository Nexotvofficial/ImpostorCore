name: Generar Wallpapers JSON Automatico

on:
  push:
    paths:
      - 'img/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.mp4'
      - '!wallpapers.json'
      - '!img/thumbs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar FFmpeg y librerias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # CACHÉ DEL MODELO IA (Hugging Face)
      - name: Cache de Modelo CLIP Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-large-v1
          restore-keys: |
            hf-clip-large-

      - name: Instalar librerias de Python
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow opencv-python-headless transformers pyyaml requests numpy

      - name: Ejecutar script generador
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PUBLITIO_KEY: ${{ secrets.PUBLITIO_KEY }}
          PUBLITIO_SECRET: ${{ secrets.PUBLITIO_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: python generador.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json img/thumbs/
          git commit -m "Auto-clasificación IA, subida Publit.io/ImgBB y Push OneSignal [skip ci]" || echo "Sin cambios para guardar"
          git push
